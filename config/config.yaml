# ==============================================================================
# Configuración del Sistema de Visión Artificial para Dron Cautivo (CV2.0)
# Optimizado para NVIDIA GPU RTX & Intel Core Ultra
# Motor de Inferencia Neuronal: Ultralytics YOLO26x (End-to-End FP16)
# ==============================================================================

model:
  # Modelo unificado YOLO26x para detección simultánea de Fuego, Humo y Ventanas
  weights: "weights/yolo26x_fire_windows.pt"
  task: "detect"
  confidence_threshold: 0.25 # Umbral calibrado de alta precisión en video aéreo 4K
  iou_threshold: 0.45
  imgsz: 640 # Resolución de inferencia nativa en GPU (100+ FPS continuos)
  device: "0" # NVIDIA GPU RTX
  half: true # Aceleración por núcleos tensores FP16 (Blackwell Architecture)
  max_det: 300
  augment: false

# Inferencia de Alta Resolución por Parches SAHI (Slicing Aided Hyper Inference)
# Divide la imagen 4K en teselas paralelas para focos distantes y ventanas diminutas
sahi:
  enabled: false # Presiona la tecla [P] en vivo para conmutar SAHI
  slice_height: 640
  slice_width: 640
  overlap_height_ratio: 0.20
  overlap_width_ratio: 0.20
  postprocess_match_threshold: 0.35

# Filtrado Temporal y Estabilidad Anti-Flicker (Anti-Parpadeos)
temporal_filter:
  min_consecutive_hits: 1 # Detección instantánea sin retardo de activación
  box_smoothing_alpha: 0.75 # Suavizado exponencial (EMA) para cajas ultraestables
  max_lost_memory: 25 # Persistencia temporal ante oclusiones y giros del dron

# Mapeo y Filtrado de Clases
classes:
  filter_only_targets: true
  fire_classes: ["fire", "flame", "smoke", "fuego", "humo"]
  window_classes: ["window", "window_frame", "balcony", "ventana", "balcon"]
  class_aliases:
    "fire": 0
    "smoke": 1
    "window": 2

# Configuración del Tracker BoT-SORT con GMC (Global Motion Compensation)
tracker:
  tracker_type: "botsort.yaml"
  gmc_method: "sparseOptFlow" # 'sparseOptFlow', 'orb', 'ecc' o 'none'
  track_high_thresh: 0.25
  track_low_thresh: 0.10
  new_track_thresh: 0.20
  track_buffer: 60
  match_thresh: 0.80
  fuse_score: true
  proximity_thresh: 0.5
  appearance_thresh: 0.25
  with_reid: false

# Analizador Espacial y Geométrico de Emergencias
analyzer:
  iou_collision_thresh: 0.02
  proximity_pixel_radius: 90
  containment_weight: 0.7
  spread_rate_history_len: 30
  alert_persistence_frames: 15
  log_incidents: true
  incident_log_file: "runs/incidents.json"
  severity_levels:
    safe: 0.0
    warning: 0.4
    critical: 0.8

# HUD y Estación Terrestre (Interfaz Táctica de Alto Rendimiento)
hud:
  show_telemetry: true
  show_trajectories: false
  show_masks: true
  show_fps: true
  show_gpu_stats: true
  show_window_status: true
  show_fire_metrics: true
  hud_theme: "tactical_dark"
  render_scale: 1.0
  font_scale: 0.55
  thickness: 2
  alpha_overlay: 0.75

# Ingesta de Video
stream:
  default_source: "samples/youtube_drone_fire.mp4.webm"
  rtsp_transport: "tcp"
  buffer_size: 2
  reconnect_delay: 2.0
  max_fps: 60

# Grabación y Reportes Forenses
recording:
  auto_record_on_alert: false
  output_dir: "runs/recordings"
  codec: "mp4v"
  fps: 30
